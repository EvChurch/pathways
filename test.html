<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EV Pathways - People pathways</title>
  </head>
  <body style="margin: 0; padding: 0">
    <iframe
      id="ev-pathways-iframe"
      style="width: 100svw; height: 100svh"
      frameborder="0"
    ></iframe>
    <script>
      const iframe = document.getElementById("ev-pathways-iframe");
      const dataPromise = fetch("./test-data.json").then((response) =>
        response.json()
      );

      iframe.addEventListener(
        "load",
        async () => {
          const data = await dataPromise;
          const message = { target: "ev-pathways", data };
          const targetOrigin = window.location.origin;

          [0, 50, 250, 1000].forEach((delay) => {
            window.setTimeout(() => {
              iframe.contentWindow.postMessage(message, targetOrigin);
            }, delay);
          });
        },
      );
      iframe.src = ".";
    </script>
  </body>
</html>
